image:
  repository: 123456789012.dkr.ecr.us-west-2.amazonaws.com/lesson-7-django
  tag: latest

service:
  type: LoadBalancer
  port: 80

hpa:
  minReplicas: 2
  maxReplicas: 6
  cpuTarget: 70

env:
  DJANGO_DEBUG: "1"
  DB_NAME: "appdb"
  DB_USER: "appuser"
  DB_PASSWORD: "apppass"
  DB_HOST: "db.example.internal"
